<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ultimate PNGTuber App</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #00ff00; /* Default Green Screen */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    /* Sleek UI Panel */
    #ui-panel {
      background: rgba(30, 30, 35, 0.95);
      color: white;
      padding: 25px;
      border-radius: 12px;
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      width: 320px;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid #444;
    }

    h3 {
      margin-top: 0;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 2px solid #555;
      padding-bottom: 10px;
    }

    .section-title {
      font-size: 12px;
      color: #aaa;
      text-transform: uppercase;
      margin-top: 20px;
      margin-bottom: 5px;
      letter-spacing: 0.5px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-size: 13px;
      font-weight: bold;
      color: #eee;
    }

    input[type="file"], input[type="color"], input[type="range"] {
      width: 100%;
      margin-top: 5px;
      box-sizing: border-box;
    }

    input[type="file"] {
      font-size: 11px;
      color: #ccc;
    }

    /* Live Audio Meter */
    #meter-container {
      width: 100%;
      height: 10px;
      background: #333;
      border-radius: 5px;
      margin-top: 5px;
      overflow: hidden;
    }
    
    #audio-meter {
      height: 100%;
      width: 0%;
      background: #28a745;
      transition: width 0.05s ease;
    }

    button {
      background-color: #5865F2; /* Discord Blurple */
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      margin-top: 15px;
      padding: 12px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #4752c4;
    }
