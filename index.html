<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ultimate PNGTuber Pro - Mega Edition</title>
  <style>
    :root {
      --accent: #7289DA;
      --accent-hover: #5b6eae;
      --bg-dark: rgba(20, 20, 25, 0.85);
      --avatar-shadow: 0px 15px 25px rgba(0,0,0,0.4);
    }
    
    body {
      margin: 0;
      padding: 0;
      background-color: #00ff00; 
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    #ui-panel {
      background: var(--bg-dark);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      padding: 25px;
      border-radius: 16px;
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      width: 320px;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: opacity 0.3s ease;
    }

    #ui-panel::-webkit-scrollbar { width: 6px; }
    #ui-panel::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
    #ui-panel::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

    h3 {
      margin-top: 0;
      font-size: 22px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 2px solid rgba(255,255,255,0.1);
      padding-bottom: 15px;
      text-align: center;
    }

    .section-title {
      font-size: 11px;
      color: var(--accent);
      text-transform: uppercase;
      margin-top: 25px;
      margin-bottom: 10px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-size: 13px;
      font-weight: 600;
      color: #ddd;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      margin-top: 15px;
    }

    input[type="file"], select {
      width: 100%;
      margin-top: 5px;
      font-size: 11px;
      color: #aaa;
      background: rgba(0,0,0,0.2);
      padding: 8px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.05);
      box-sizing: border-box;
      cursor: pointer;
    }

    select { font-size: 13px; color: #fff; }
    input[type="color"] { width: 100%; height: 35px; border: none; border-radius: 6px; background: none; cursor: pointer; margin-top: 5px; }
    input[type="range"] { width: 100%; margin-top: 8px; accent-color: var(--accent); }
    input[type="checkbox"] { accent-color: var(--accent); width: 18px; height: 18px; cursor: pointer; }

    #meter-container {
      width: 100%;
      height: 12px;
      background: rgba(0,0,0,0.4);
      border-radius: 6px;
      margin-top: 8px;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    }
    
    #audio-meter {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #28a745, #00ff88);
      transition: width 0.05s ease;
    }

    button {
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      margin-top: 15px;
      padding: 12px;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    button:hover { background-color: var(--accent-hover); transform: translateY(-2px); }
    #hide-ui-btn { background-color: #444; }
    #hide-ui-btn:hover { background-color: #555; }
    
    #clear-data-btn {
      background-color: transparent;
      border: 1px solid #ff4444;
      color: #ff4444;
      margin-top: 25px;
    }
    #clear-data-btn:hover { background-color: #ff4444; color: #fff; }
    .hidden { opacity: 0; pointer-events: none; }

    #avatar-container {
      position: absolute;
      cursor: grab;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #avatar-container:active { cursor: grabbing; }
    
    #flip-wrapper { transition: transform 0.2s; }

    #avatar {
      height: 85vh; 
      object-fit: contain;
      filter: var(--avatar-shadow);
      pointer-events: none; 
      transition: height 0.1s;
    }

    /* --- EXPANDED TALKING ANIMATIONS --- */
    @keyframes shake {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      25% { transform: translate(-2px, -3px) rotate(-1.5deg); }
      50% { transform: translate(-2px, 0px) rotate(1.5deg); }
      75% { transform: translate(3px, 2px) rotate(0deg); }
      100% { transform: translate(1px, -1px) rotate(-1.5deg); }
    }
    .anim-shake { animation: shake 0.15s infinite; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) scaleY(1); }
      50% { transform: translateY(-20px) scaleY(1.05); }
    }
    .anim-bounce { animation: bounce 0.3s infinite ease-in-out; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    .anim-pulse { animation: pulse 0.25s infinite ease-in-out; }

    @keyframes tilt {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(6deg) scale(1.02); }
    }
    .anim-tilt { animation: tilt 0.3s infinite ease-in-out; }

    @keyframes wiggle {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }
    .anim-wiggle { animation: wiggle 0.12s infinite ease-in-out; }

    @keyframes stretch {
      0%, 100% { transform: scaleY(1) scaleX(1); }
      50% { transform: scaleY(1.1) scaleX(0.95) translateY(-5px); }
    }
    .anim-stretch { animation: stretch 0.25s infinite ease-in-out; }

    @keyframes spinDrift {
      0% { transform: rotate(0deg) translateY(0); }
      25% { transform: rotate(-2deg) translateY(-5px); }
      75% { transform: rotate(2deg) translateY(5px); }
      100% { transform: rotate(0deg) translateY(0); }
    }
    .anim-spin-drift { animation: spinDrift 0.4s infinite ease-in-out; }

    @keyframes earthquake {
      0% { transform: translate(2px, 2px); }
      20% { transform: translate(-3px, 1px); }
      40% { transform: translate(-1px, -3px); }
      60% { transform: translate(3px, -1px); }
      80% { transform: translate(-2px, 3px); }
      100% { transform: translate(2px, 2px); }
    }
    .anim-earthquake { animation: earthquake 0.08s infinite; }

    /* --- EXPANDED IDLE ANIMATIONS --- */
    @keyframes floatAnim {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    .anim-idle-float { animation: floatAnim 3s infinite ease-in-out; }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02) translateY(-2px); }
    }
    .anim-idle-breathe { animation: breathe 4s infinite ease-in-out; }

    @keyframes headNod {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      30% { transform: translateY(4px) rotate(1deg); }
      70% { transform: translateY(-2px) rotate(-1deg); }
    }
    .anim-idle-nod { animation: headNod 2.5s infinite ease-in-out; }

    @keyframes slowSway {
      0%, 100% { transform: rotate(-1.5deg); }
      50% { transform: rotate(1.5deg); }
    }
    .anim-idle-sway { animation: slowSway 5s infinite ease-in-out; }

    @keyframes tenseRelax {
      0%, 90%, 100% { transform: scale(1); }
      95% { transform: scale(1.03, 0.98); }
    }
    .anim-idle-tense { animation: tenseRelax 6s infinite ease-in-out; }

    @keyframes shimmerFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.01); }
    }
    .anim-idle-shimmer { animation: shimmerFloat 2s infinite ease-in-out; }

    .anim-none { animation: none; }
  </style>
</head>
<body>

  <div id="ui-panel">
    <h3>PNGTuber Pro</h3>
    
    <div class="section-title">1. Avatar Uploads (Auto-Saves)</div>
    <label>Idle (Closed Mouth, Open Eyes)</label>
    <input type="file" id="img-idle" accept="image/*">
    <label>Blink (Closed Mouth, Closed Eyes)</label>
    <input type="file" id="img-blink" accept="image/*">
    <label>Talk (Open Mouth, Open Eyes)</label>
    <input type="file" id="img-talk" accept="image/*">
    <label>Talk + Blink</label>
    <input type="file" id="img-talk-blink" accept="image/*">
    
    <div class="section-title">2. Customization & Movement</div>
    <label>Talking Animation:</label>
    <select id="anim-style">
      <option value="anim-shake">Fast Shake (Default)</option>
      <option value="anim-bounce">Smooth Bounce</option>
      <option value="anim-pulse">Pulse / Expand</option>
      <option value="anim-tilt">Side Tilt</option>
      <option value="anim-wiggle">Quick Wiggle</option>
      <option value="anim-stretch">Rubber Band Stretch</option>
      <option value="anim-spin-drift">Spin Drift</option>
      <option value="anim-earthquake">Earthquake</option>
    </select>
    
    <label>Idle Floating:</label>
    <select id="idle-anim-style">
      <option value="anim-idle-float">Float Gently</option>
      <option value="anim-idle-breathe">Breathing / Scale</option>
      <option value="anim-idle-nod">Gentle Head Nod</option>
      <option value="anim-idle-sway">Slow Sway</option>
      <option value="anim-idle-tense">Tense & Relax</option>
      <option value="anim-idle-shimmer">Shimmer Float</option>
      <option value="anim-none">None (Stand Still)</option>
    </select>

    <label>Avatar Size:</label>
    <input type="range" id="avatar-size" min="20" max="150" value="85">

    <label>Glow / Shadow Color:</label>
    <input type="color" id="shadow-color" value="#000000">

    <label>Glow Blur Strength:</label>
    <input type="range" id="shadow-blur" min="0" max="50" value="25">
    
    <label class="checkbox-label">
      <input type="checkbox" id="flip-avatar"> Flip Avatar Horizontally
    </label>

    <div class="section-title">3. Environment</div>
    <label>Background Color (Green Screen)</label>
    <input type="color" id="bg-color" value="#00ff00">
    <label>Background Opacity:</label>
    <input type="range" id="bg-opacity" min="0" max="100" value="100">
    <label>OR Background Image</label>
    <input type="file" id="bg-image" accept="image/*">

    <div class="section-title">4. Microphone Settings</div>
    <label>Mic Boost (Gain):</label>
    <input type="range" id="mic-boost" min="10" max="50" value="10">
    
    <label>Sensitivity Threshold:</label>
    <input type="range" id="sensitivity" min="1" max="100" value="15">
    
    <label>Live Mic Level:</label>
    <div id="meter-container"><div id="audio-meter"></div></div>
    
    <button id="start-btn">Connect Microphone</button>
    <button id="hide-ui-btn">Hide Menu (OBS Mode)</button>
    <p style="font-size: 11px; color: #888; text-align: center; margin-bottom: 0;">Refresh page to bring menu back.</p>
    
    <button id="clear-data-btn">Reset All Saved Data</button>
  </div>

  <div id="avatar-container">
    <div id="flip-wrapper">
      <img id="avatar" src="" alt="Upload your avatar in the menu!" class="anim-idle-float">
    </div>
  </div>

  <script>
    const uiPanel = document.getElementById('ui-panel');
    const avatar = document.getElementById('avatar');
    const avatarContainer = document.getElementById('avatar-container');
    const flipWrapper = document.getElementById('flip-wrapper');
    const bgInput = document.getElementById('bg-color');
    const bgOpacitySlider = document.getElementById('bg-opacity');
    const sensitivitySlider = document.getElementById('sensitivity');
    const boostSlider = document.getElementById('mic-boost');
    const sizeSlider = document.getElementById('avatar-size');
    const shadowColorInput = document.getElementById('shadow-color');
    const shadowBlurSlider = document.getElementById('shadow-blur');
    const flipCheckbox = document.getElementById('flip-avatar');
    const animSelect = document.getElementById('anim-style');
    const idleAnimSelect = document.getElementById('idle-anim-style');
    const startBtn = document.getElementById('start-btn');
    const hideUiBtn = document.getElementById('hide-ui-btn');
    const audioMeter = document.getElementById('audio-meter');

    let srcIdle = localStorage.getItem('png_idle') || '';
    let srcBlink = localStorage.getItem('png_blink') || '';
    let srcTalk = localStorage.getItem('png_talk') || '';
    let srcTalkBlink = localStorage.getItem('png_talkBlink') || '';
    
    let isTalking = false;
    let isBlinking = false;
    let audioContext, analyser;
    
    function hexToRgba(hex, opacity) {
      let c = hex.replace('#','');
      if(c.length===3) c = c.split('').map(x => x+x).join('');
      const num = parseInt(c,16);
      return `rgba(${num>>16},${(num>>8)&255},${num&255},${opacity})`;
    }

    function updateShadowStyle() {
      const color = shadowColorInput.value;
      const blur = shadowBlurSlider.value;
      document.documentElement.style.setProperty('--avatar-shadow', `0px 15px ${blur}px ${hexToRgba(color, 0.6)}`);
    }

    function loadSavedData() {
      updateAvatarImage();
      
      if (localStorage.getItem('png_bgColor')) {
        bgInput.value = localStorage.getItem('png_bgColor');
        document.body.style.backgroundColor = bgInput.value;
      }
      if (localStorage.getItem('png_bgOpacity')) {
        bgOpacitySlider.value = localStorage.getItem('png_bgOpacity');
        document.body.style.opacity = bgOpacitySlider.value / 100;
      }
      if (localStorage.getItem('png_bgImage')) document.body.style.backgroundImage = `url(${localStorage.getItem('png_bgImage')})`;
      if (localStorage.getItem('png_sensitivity')) sensitivitySlider.value = localStorage.getItem('png_sensitivity');
      if (localStorage.getItem('png_boost')) boostSlider.value = localStorage.getItem('png_boost');
      
      if (localStorage.getItem('png_shadowColor')) shadowColorInput.value = localStorage.getItem('png_shadowColor');
      if (localStorage.getItem('png_shadowBlur')) shadowBlurSlider.value = localStorage.getItem('png_shadowBlur');
      updateShadowStyle();

      if (localStorage.getItem('png_animStyle')) animSelect.value = localStorage.getItem('png_animStyle');
      if (localStorage.getItem('png_idleAnimStyle')) idleAnimSelect.value = localStorage.getItem('png_idleAnimStyle');
      
      if (localStorage.getItem('png_avatarSize')) {
        sizeSlider.value = localStorage.getItem('png_avatarSize');
        avatar.style.height = sizeSlider.value + 'vh';
      }
      
      if (localStorage.getItem('png_flip') === 'true') {
        flipCheckbox.checked = true;
        flipWrapper.style.transform = 'scaleX(-1)';
      }

      const savedX = localStorage.getItem('png_xOffset');
      const savedY = localStorage.getItem('png_yOffset');
      if (savedX && savedY) {
        xOffset = parseFloat(savedX);
        yOffset = parseFloat(savedY);
        avatarContainer.style.transform = `translate(${xOffset}px, ${yOffset}px)`;
      }
    }

    function handleUploadWithSave(inputId, storageKey, callback) {
      document.getElementById(inputId).addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function(event) {
            const base64 = event.target.result;
            try {
              localStorage.setItem(storageKey, base64);
              callback(base64);
            } catch (err) {
              alert("Image file is too large to save permanently. Try using a smaller PNG file.");
              callback(base64);
            }
          };
          reader.readAsDataURL(file);
        }
      });
    }

    handleUploadWithSave('img-idle', 'png_idle', (url) => { srcIdle = url; updateAvatarImage(); });
    handleUploadWithSave('img-blink', 'png_blink', (url) => { srcBlink = url; updateAvatarImage(); });
    handleUploadWithSave('img-talk', 'png_talk', (url) => { srcTalk = url; updateAvatarImage(); });
    handleUploadWithSave('img-talk-blink', 'png_talkBlink', (url) => { srcTalkBlink = url; updateAvatarImage(); });
    handleUploadWithSave('bg-image', 'png_bgImage', (url) => { document.body.style.backgroundImage = `url(${url})`; });

    bgInput.addEventListener('input', (e) => {
      document.body.style.backgroundImage = 'none';
      localStorage.removeItem('png_bgImage');
      document.body.style.backgroundColor = e.target.value;
      localStorage.setItem('png_bgColor', e.target.value);
    });

    bgOpacitySlider.addEventListener('input', (e) => {
      document.body.style.opacity = e.target.value / 100;
      localStorage.setItem('png_bgOpacity', e.target.value);
    });

    sensitivitySlider.addEventListener('input', (e) => localStorage.setItem('png_sensitivity', e.target.value));
    boostSlider.addEventListener('input', (e) => localStorage.setItem('png_boost', e.target.value));
    
    shadowColorInput.addEventListener('input', (e) => {
      localStorage.setItem('png_shadowColor', e.target.value);
      updateShadowStyle();
    });

    shadowBlurSlider.addEventListener('input', (e) => {
      localStorage.setItem('png_shadowBlur', e.target.value);
      updateShadowStyle();
    });

    sizeSlider.addEventListener('input', (e) => {
      avatar.style.height = e.target.value + 'vh';
      localStorage.setItem('png_avatarSize', e.target.value);
    });
    
    flipCheckbox.addEventListener('change', (e) => {
      flipWrapper.style.transform = e.target.checked ? 'scaleX(-1)' : 'scaleX(1)';
      localStorage.setItem('png_flip', e.target.checked);
    });

    animSelect.addEventListener('change', (e) => {
      localStorage.setItem('png_animStyle', e.target.value);
      updateAvatarImage(); 
    });

    idleAnimSelect.addEventListener('change', (e) => {
      localStorage.setItem('png_idleAnimStyle', e.target.value);
      updateAvatarImage();
    });

    hideUiBtn.addEventListener('click', () => uiPanel.classList.add('hidden'));
    document.getElementById('clear-data-btn').addEventListener('click', () => {
      if (confirm("Reset everything?")) { localStorage.clear(); location.reload(); }
    });

    let isDragging = false;
    let currentX = 0, currentY = 0, initialX = 0, initialY = 0, xOffset = 0, yOffset = 0;

    avatarContainer.addEventListener("mousedown", dragStart);
    document.addEventListener("mouseup", dragEnd);
    document.addEventListener("mousemove", drag);

    function dragStart(e) {
      initialX = e.clientX - xOffset;
      initialY = e.clientY - yOffset;
      if (e.target === avatarContainer || e.target === flipWrapper || e.target === avatar) isDragging = true;
    }
    function dragEnd() {
      initialX = currentX; initialY = currentY; isDragging = false;
      localStorage.setItem('png_xOffset', xOffset); localStorage.setItem('png_yOffset', yOffset);
    }
    function drag(e) {
      if (isDragging) {
        e.preventDefault();
        currentX = e.clientX - initialX; currentY = e.clientY - initialY;
        xOffset = currentX; yOffset = currentY;
        avatarContainer.style.transform = `translate(${currentX}px, ${currentY}px)`;
      }
    }

    function updateAvatarImage() {
      avatar.className = '';
      const talkAnim = animSelect.value;
      const idleAnim = idleAnimSelect.value;

      if (isTalking) {
        avatar.src = (isBlinking && srcTalkBlink) ? srcTalkBlink : (srcTalk || srcIdle);
        avatar.classList.add(talkAnim);
      } else {
        avatar.src = (isBlinking && srcBlink) ? srcBlink : srcIdle;
        avatar.classList.add(idleAnim);
      }
    }

    function blinkLoop() {
      isBlinking = true;
      updateAvatarImage();
      setTimeout(() => {
        isBlinking = false;
        updateAvatarImage();
        setTimeout(blinkLoop, Math.random() * 4000 + 1500); 
      }, 150);
    }
    setTimeout(blinkLoop, 2000);

    startBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === 'suspended') await audioContext.resume();

        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        const microphone = audioContext.createMediaStreamSource(stream);
        microphone.connect(analyser);
        
        startBtn.textContent = "Microphone Connected";
        startBtn.style.backgroundColor = "#28a745";
        startBtn.disabled = true;
        
        checkAudioLevel();
      } catch (err) {
        alert('Could not access microphone! Allow permissions.');
      }
    });

    function checkAudioLevel() {
      if (!analyser) return;
      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(dataArray);
      
      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
      
      const boostMultiplier = boostSlider.value / 10;
      let average = (sum / dataArray.length) * boostMultiplier;
      
      audioMeter.style.width = Math.min(average * 2, 100) + '%';
      
      const threshold = sensitivitySlider.value;
      const currentlyTalking = average > threshold;
      
      if (currentlyTalking !== isTalking) {
        isTalking = currentlyTalking;
        updateAvatarImage();
      }
      
      requestAnimationFrame(checkAudioLevel);
    }

    loadSavedData();
  </script>
</body>
</html>
