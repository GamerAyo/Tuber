<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ultimate PNGTuber App</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #00ff00; /* Default Green Screen */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    /* Sleek UI Panel */
    #ui-panel {
      background: rgba(30, 30, 35, 0.95);
      color: white;
      padding: 25px;
      border-radius: 12px;
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      width: 320px;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid #444;
    }

    h3 {
      margin-top: 0;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 2px solid #555;
      padding-bottom: 10px;
    }

    .section-title {
      font-size: 12px;
      color: #aaa;
      text-transform: uppercase;
      margin-top: 20px;
      margin-bottom: 5px;
      letter-spacing: 0.5px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-size: 13px;
      font-weight: bold;
      color: #eee;
    }

    input[type="file"], input[type="color"], input[type="range"] {
      width: 100%;
      margin-top: 5px;
      box-sizing: border-box;
    }

    input[type="file"] {
      font-size: 11px;
      color: #ccc;
    }

    /* Live Audio Meter */
    #meter-container {
      width: 100%;
      height: 10px;
      background: #333;
      border-radius: 5px;
      margin-top: 5px;
      overflow: hidden;
    }
    
    #audio-meter {
      height: 100%;
      width: 0%;
      background: #28a745;
      transition: width 0.05s ease;
    }

    button {
      background-color: #5865F2; /* Discord Blurple */
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      margin-top: 15px;
      padding: 12px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #4752c4;
    }

    #hide-ui-btn {
      background-color: #444;
    }
    
    #hide-ui-btn:hover {
      background-color: #555;
    }

    .hidden {
      display: none !important;
    }

    /* Avatar Settings */
    #avatar-container {
      position: relative;
    }

    #avatar {
      max-height: 85vh;
      max-width: 85vw;
      object-fit: contain;
      transition: transform 0.05s ease-out;
      filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.3)); /* Nice shadow on the avatar */
    }

    .talking {
      transform: scale(1.04) translateY(-8px); 
    }
  </style>
</head>
<body>

  <div id="ui-panel">
    <h3>PNGTuber Pro</h3>
    
    <div class="section-title">1. Avatar Images</div>
    <label>Idle (Closed Mouth, Open Eyes)</label>
    <input type="file" id="img-idle" accept="image/*">
    
    <label>Blink (Closed Mouth, Closed Eyes)</label>
    <input type="file" id="img-blink" accept="image/*">
    
    <label>Talk (Open Mouth, Open Eyes)</label>
    <input type="file" id="img-talk" accept="image/*">
    
    <label>Talk + Blink</label>
    <input type="file" id="img-talk-blink" accept="image/*">
    
    <div class="section-title">2. Environment</div>
    <label>Background Color (Green Screen)</label>
    <input type="color" id="bg-color" value="#00ff00">
    
    <label>OR Upload Background Image</label>
    <input type="file" id="bg-image" accept="image/*">

    <div class="section-title">3. Microphone Settings</div>
    <label>Sensitivity Threshold:</label>
    <input type="range" id="sensitivity" min="1" max="100" value="15">
    
    <label>Live Mic Level:</label>
    <div id="meter-container">
      <div id="audio-meter"></div>
    </div>
    
    <button id="start-btn">Connect Microphone</button>
    <button id="hide-ui-btn">Hide Menu (OBS Mode)</button>
    <p style="font-size: 11px; color: #888; text-align: center; margin-bottom: 0;">Refresh page to bring menu back.</p>
  </div>

  <div id="avatar-container">
    <img id="avatar" src="" alt="Upload your avatar images in the top left menu!">
  </div>

  <script>
    const uiPanel = document.getElementById('ui-panel');
    const avatar = document.getElementById('avatar');
    const bgInput = document.getElementById('bg-color');
    const bgImageInput = document.getElementById('bg-image');
    
    const sensitivitySlider = document.getElementById('sensitivity');
    const startBtn = document.getElementById('start-btn');
    const hideUiBtn = document.getElementById('hide-ui-btn');
    const audioMeter = document.getElementById('audio-meter');

    let srcIdle = '';
    let srcBlink = '';
    let srcTalk = '';
    let srcTalkBlink = '';
    let isTalking = false;
    let isBlinking = false;
    
    let audioContext;
    let analyser;

    // File Upload Handler
    function handleUpload(inputId, callback) {
      document.getElementById(inputId).addEventListener('change', (e) => {
        if(e.target.files[0]) {
          const url = URL.createObjectURL(e.target.files[0]);
          callback(url);
        }
      });
    }

    handleUpload('img-idle', (url) => { srcIdle = url; updateAvatarImage(); });
    handleUpload('img-blink', (url) => { srcBlink = url; updateAvatarImage(); });
    handleUpload('img-talk', (url) => { srcTalk = url; updateAvatarImage(); });
    handleUpload('img-talk-blink', (url) => { srcTalkBlink = url; updateAvatarImage(); });
    
    handleUpload('bg-image', (url) => { document.body.style.backgroundImage = `url(${url})`; });

    bgInput.addEventListener('input', (e) => {
      document.body.style.backgroundImage = 'none'; // Remove image if color is picked
      document.body.style.backgroundColor = e.target.value;
    });

    hideUiBtn.addEventListener('click', () => uiPanel.classList.add('hidden'));

    // Avatar Logic
    function updateAvatarImage() {
      if (isTalking) {
        avatar.src = (isBlinking && srcTalkBlink) ? srcTalkBlink : (srcTalk || srcIdle);
        avatar.classList.add('talking');
      } else {
        avatar.src = (isBlinking && srcBlink) ? srcBlink : srcIdle;
        avatar.classList.remove('talking');
      }
    }

    // Random Blinking
    function blinkLoop() {
      isBlinking = true;
      updateAvatarImage();
      setTimeout(() => {
        isBlinking = false;
        updateAvatarImage();
        setTimeout(blinkLoop, Math.random() * 3000 + 2000);
      }, 150);
    }
    setTimeout(blinkLoop, 2000);

    // Microphone Logic
    startBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        // Force AudioContext to wake up (fixes bug where browser ignores mic)
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }

        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        const microphone = audioContext.createMediaStreamSource(stream);
        microphone.connect(analyser);
        
        startBtn.textContent = "Microphone Connected";
        startBtn.style.backgroundColor = "#28a745";
        startBtn.disabled = true;
        
        checkAudioLevel();
      } catch (err) {
        alert('Could not access microphone! Make sure permissions are allowed.');
        console.error(err);
      }
    });

    function checkAudioLevel() {
      if (!analyser) return;
      
      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(dataArray);
      
      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) { sum += dataArray[i]; }
      let average = sum / dataArray.length;
      
      // Update visual meter (cap it at 100%)
      const meterWidth = Math.min(average * 2, 100); 
      audioMeter.style.width = meterWidth + '%';
      
      // Check if loud enough to trigger talking
      const threshold = sensitivitySlider.value;
      const currentlyTalking = average > threshold;
      
      if (currentlyTalking !== isTalking) {
        isTalking = currentlyTalking;
        updateAvatarImage();
      }
      
      requestAnimationFrame(checkAudioLevel);
    }
  </script>
</body>
</html>
